server:
  port: 8081

spring:
  application:
    name: products-service
  datasource:
    url: jdbc:postgresql://localhost:5433/productsdb
    username: products
    password: products
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: productsdb
  security:
    user:
      name: admin
      password: admin

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /swagger-ui
management:
  endpoints.web.exposure.include: health,info,metrics

logging:
  level:
    root: ERROR
    org.springframework: DEBUG
    com.jorgeandreu: DEBUG
    org.flywaydb: DEBUG

debug: true

products:
  initial-version: 1

env:
  SYSTEM_USER_PASS: ${SYSTEM_USER_PASS:systemPass!2024}
  ADMIN_USER_PASS: ${ADMIN_USER_PASS:userPass!2024}