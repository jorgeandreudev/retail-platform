server:
  port: 8082

spring:
  application:
    name: orders-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/ordersdb
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: ordersdb
  security:
    user:
      name: admin
      password: admin
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        spring.json.trusted.packages: "*"
    admin:
      auto-create: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

feign:
  httpclient:
    enabled: false
  okhttp:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 2000
        loggerLevel: BASIC

resilience4j:
  circuitbreaker:
    instances:
      products:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50


springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /swagger-ui
management:
  endpoints.web.exposure.include: health,info,metrics

logging:
  level:
    root: ERROR
    org.springframework: DEBUG
    com.jorgeandreu: DEBUG
    org.flywaydb: DEBUG
    com.jorgeandreu.orders.infrastructure.products.ProductsFeignClient: DEBUG

debug: true

orders:
  initial-version: 1
  topics:
    order-canceled: order-canceled

products:
  auth:
    username: system
    password: system